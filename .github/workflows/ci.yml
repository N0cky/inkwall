name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  # Docker Publish ruft diesen Workflow vor dem Bauen auf: ohne grüne Tests kein Image
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = kleinste unterstützte Version (README), 3.13 = die im Docker-Image
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt ruff==0.16.9

      - name: Install fonts (same as the Docker image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Lint (syntax errors, undefined and unused names)
        run: ruff check app modules tests wsgi.py

      - name: Byte-compile everything
        run: python -m compileall -q app modules tests wsgi.py

      - name: Run tests
        # -t . lädt tests/ als Paket, damit tests/__init__.py die Isolation
        # (Temp-Config, Temp-Output, Temp-Logs) vor dem ersten app-Import setzt
        run: python -m unittest discover -s tests -t . -v

      - name: Template smoke test
        run: |
          python -c "from app.server import app; [app.jinja_env.get_template(name) for name in ['base.html','anzeige.html','inhalte.html','geraet.html','system.html']]; print('TEMPLATES_OK')"

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t inkwall:test .

      - name: Start like on Unraid (PUID 99, PGID 100, empty volumes, no settings file)
        run: |
          mkdir -p /tmp/ink/config /tmp/ink/output /tmp/ink/logs
          docker run -d --name inkwall -p 8787:8787 -e PUID=99 -e PGID=100 \
            -v /tmp/ink/config:/config -v /tmp/ink/output:/output -v /tmp/ink/logs:/logs \
            inkwall:test

      - name: Health check and web UI
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/health
          curl -fsS -o /dev/null http://127.0.0.1:8787/
          curl -fsS -o /dev/null http://127.0.0.1:8787/geraet

      - name: File ownership and read-only code
        run: |
          docker exec inkwall sh -c 'test "$(id -u appuser):$(id -g appuser)" = "99:100"'
          test "$(stat -c %u:%g /tmp/ink/output)" = "99:100"
          docker exec -u appuser inkwall sh -c 'touch /output/.probe /logs/.probe /config/.probe'
          if docker exec -u appuser inkwall sh -c 'touch /app/.probe' 2>/dev/null; then
            echo "Der Programmcode ist für den Server beschreibbar"; exit 1
          fi

      - name: Container log
        if: always()
        run: docker logs inkwall

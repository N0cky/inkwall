<!doctype html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inkwall{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <script>
        (function () {
            var t = localStorage.getItem('inkwall-ui-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        [data-theme="dark"] {
            --bg:            #0f0f0e;
            --surface:       #1b1b1a;
            --surface2:      #222221;
            --surface3:      #2a2a28;
            --border:        rgba(255,255,255,0.07);
            --border-strong: rgba(255,255,255,0.13);
            --text:          #f0ede8;
            --text-soft:     #c8c3bb;
            --muted:         #9a9288;   /* ≥ 4,5:1 auf allen dunklen Flächen */
            --accent:        #14b8a6;
            --accent-hover:  #0d9488;
            --accent-dim:    rgba(20,184,166,0.12);
            --chip-bg:       rgba(255,255,255,0.05);
            --ok:            #4ade80;
            --warn:          #fbbf24;
            --danger:        #f87171;
            --shadow-page:   0 40px 120px rgba(0,0,0,0.7);
        }
        [data-theme="light"] {
            --bg:            #eeeae4;
            --surface:       #f8f5f0;
            --surface2:      #ffffff;
            --surface3:      #f0ece6;
            --border:        rgba(40,35,28,0.10);
            --border-strong: rgba(40,35,28,0.18);
            --text:          #18140e;
            --text-soft:     #4a4038;
            --muted:         #6e655c;
            --accent:        #0f766e;
            --accent-hover:  #0e6560;
            --accent-dim:    rgba(15,118,110,0.10);
            --chip-bg:       rgba(0,0,0,0.04);
            --ok:            #15803d;
            --warn:          #b45309;
            --danger:        #b91c1c;
            --shadow-page:   0 24px 80px rgba(30,22,12,0.15);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px 60px;
            transition: background 0.25s, color 0.25s;
        }
        a { color: inherit; }

        .page-shell {
            max-width: {% block page_width %}1260px{% endblock %};
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 28px;
            box-shadow: var(--shadow-page);
            overflow: clip; /* schneidet die Ecken ab, ohne die klebende Speicherleiste zu brechen (hidden würde sie lösen) */
        }
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 28px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
            flex-wrap: wrap;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border);
            background: var(--surface3);
            flex: 0 0 auto;
        }
        .logo-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .logo-dot { color: var(--accent); }
        .logo-sub {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .topbar-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 280px;
            flex-wrap: wrap;
        }
        .nav-links {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--chip-bg);
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-link {
            text-decoration: none;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            border: 1px solid transparent;
        }
        .nav-link:hover {
            color: var(--accent);
            background: var(--accent-dim);
        }
        .nav-link.active {
            color: var(--accent);
            background: var(--accent-dim);
            border-color: var(--border-strong);
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-strong);
            border-radius: 999px;
            background: var(--chip-bg);
            color: var(--text);
            font-size: 13px;
            padding: 7px 16px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            font-family: inherit;
            font-weight: 700;
            white-space: nowrap;
        }
        .theme-toggle:hover {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }
        .theme-toggle-icon { font-size: 15px; }
        .page-content {
            padding: 28px;
        }
        /* Statusleiste: was gerade Aufmerksamkeit braucht, auf jeder Seite (leer = verborgen) */
        .issue-strip { display: grid; gap: 6px; padding: 10px 28px; border-bottom: 1px solid var(--border); background: var(--surface3); }
        .issue { display: flex; gap: 10px; align-items: baseline; font-size: 13px; font-weight: 700; color: var(--text); text-decoration: none; }
        .issue .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--accent); }
        .issue.danger .dot { background: var(--danger); }
        .issue.warn .dot { background: var(--warn); }
        a.issue:hover .text { text-decoration: underline; }
        .section-label {
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .surface-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 18px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--text);
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .section-title::before {
            content: "";
            display: block;
            width: 4px;
            height: 18px;
            background: var(--accent);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ── Gemeinsame Bausteine (Chips, Schalter, Knöpfe, Toast, Felder) ── */
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 800;
            letter-spacing: .03em; white-space: nowrap;
            background: var(--chip-bg); color: var(--muted); border: 1px solid var(--border);
        }
        .chip.ok     { background: rgba(74,222,128,.12);  color: var(--ok);     border-color: rgba(74,222,128,.25); }
        .chip.warn   { background: rgba(245,158,11,.14);  color: var(--warn);   border-color: rgba(245,158,11,.28); }
        .chip.danger { background: rgba(239,68,68,.12);   color: var(--danger); border-color: rgba(239,68,68,.25); }
        .chip.accent { background: var(--accent-dim);      color: var(--accent); border-color: rgba(20,184,166,.35); }
        .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
        .switch .track {
            position: absolute; inset: 0; border-radius: 999px; background: var(--border-strong);
            transition: background .15s; cursor: pointer;
        }
        .switch .track::after {
            content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
            background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3);
        }
        .switch input:checked + .track { background: var(--accent); }
        .switch input:checked + .track::after { transform: translateX(18px); }
        .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
        .switch input:disabled + .track { opacity: .45; cursor: not-allowed; }

        [hidden] { display: none !important; } /* sonst gewinnt .btn { display } gegen das hidden-Attribut */
        .btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
            border: 1px solid var(--border-strong); background: var(--chip-bg); color: var(--text);
            font-size: 12.5px; font-weight: 800; cursor: pointer; text-decoration: none; font-family: inherit;
            transition: background .15s, color .15s, border-color .15s; white-space: nowrap;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        .btn.primary { border-color: var(--accent); background: var(--accent); color: #062a26; }
        .btn.primary:hover { filter: brightness(1.08); color: #062a26; }
        .btn.small { padding: 6px 11px; font-size: 11.5px; }
        .btn:disabled { opacity: .55; cursor: wait; }
        .btn:focus-visible, .nav-link:focus-visible, .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px; background: var(--chip-bg); }
        .seg label { padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 800; cursor: pointer; color: var(--text-soft); }
        .seg input { position: absolute; opacity: 0; width: 0; height: 0; }
        .seg input:checked + label { background: var(--accent); color: #062a26; }
        .seg input:focus-visible + label { outline: 2px solid var(--accent); }

        .toast-host { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; }
        .toast {
            background: var(--surface2); border: 1px solid var(--border-strong); color: var(--text);
            padding: 11px 16px; border-radius: 14px; font-size: 13px; font-weight: 700;
            box-shadow: var(--shadow-page); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
        }
        .toast.show { opacity: 1; transform: none; }
        .toast.ok { border-color: rgba(74,222,128,.4); }
        .toast.error { border-color: rgba(239,68,68,.45); }

        /* ── Formulare (fields.js) ── */
        .card { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; }
        .card-body { padding: 18px; }
        .card-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 12px; }
        .group { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
        .group:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
        .group-title { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
        .group-desc { margin-bottom: 12px; max-width: 72ch; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .field { background: var(--surface3); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
        .field.wide { grid-column: 1 / -1; }
        .field.is-hidden { display: none; }
        .field.has-error { border-color: var(--danger); }
        .field:focus-within { border-color: var(--accent); }
        .field-label { font-size: 12.5px; font-weight: 800; }
        .field input[type="text"], .field input[type="number"], .field input[type="password"], .field select {
            width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border-strong);
            background: var(--surface2); color: var(--text); font-family: inherit; font-size: 13.5px;
        }
        .field input:focus, .field select:focus { outline: none; border-color: var(--accent); }
        .field .pw { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
        .field .duration { display: grid; grid-template-columns: 1fr 130px; gap: 8px; }
        .field .checks { display: flex; flex-wrap: wrap; gap: 8px; }
        .field .check { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface2); font-size: 13px; cursor: pointer; }
        .field .check input { accent-color: var(--accent); width: 15px; height: 15px; }
        .field .prio { display: grid; gap: 6px; }
        .field .prio-item { display: grid; grid-template-columns: 18px 1fr auto auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); }
        .field .prio-item .move { display: inline-flex; gap: 4px; }
        .field .prio-item.dragging { opacity: .4; }
        .field .prio-item .handle { color: var(--muted); cursor: grab; }
        .field .prio-item .rank { font-size: 11px; font-weight: 800; color: var(--accent); }
        .field .list-rows { display: grid; gap: 8px; margin-bottom: 8px; }
        .field .list-row { display: grid; gap: 8px; align-items: center; }
        .field .list-row input, .field .list-row select { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 13px; }
        .field-link { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 700; }
        .field-link:hover { text-decoration: underline; }
        .actions-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
        /* Speicherleiste (fields.savebar): eine pro Formular, klebt am unteren Fensterrand, solange die Karte im Bild ist */
        .savebar {
            position: sticky; bottom: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            margin-top: 16px; padding: 10px 12px; border-radius: 16px;
            background: var(--surface2); border: 1px solid var(--border-strong); box-shadow: var(--shadow-page);
        }
        .savebar.dirty { border-color: var(--warn); }
        .savebar .state { font-size: 12.5px; color: var(--muted); margin-left: auto; }
        .savebar.dirty .state { color: var(--warn); font-weight: 800; }
        .banner { display: none; border-radius: 14px; padding: 12px 16px; font-size: 13px; font-weight: 700; background: rgba(239,68,68,.10); color: var(--danger); border: 1px solid rgba(239,68,68,.22); margin-bottom: 12px; }
        .banner.show { display: block; }
        .banner ul { margin: 6px 0 0; padding-left: 18px; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .field .duration { grid-template-columns: 1fr; } }

        .field-error { color: var(--danger); font-size: 12px; font-weight: 700; margin-top: 4px; }
        input.invalid, select.invalid { border-color: var(--danger) !important; }
        .hint { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
        @media (prefers-reduced-motion: reduce) { .toast, .switch .track, .switch .track::after { transition: none; } }

        @media (max-width: 920px) {
            .topbar-center {
                order: 3;
                width: 100%;
            }
        }
        @media (max-width: 600px) {
            body { padding: 8px 8px 32px; }
            .topbar { padding: 14px 16px; }
            .page-content { padding: 18px 16px; }
            .issue-strip { padding: 10px 16px; }
            .nav-links { width: 100%; }
            .savebar { bottom: 8px; }
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>

<div class="page-shell">
    <header class="topbar">
        <div class="topbar-left">
            <img class="logo-icon" src="{{ url_for('static', filename='logo.svg') }}" alt="Inkwall logo">
            <span class="logo-name">Ink<span class="logo-dot">wall</span></span>
            <span class="logo-sub">{% block page_subtitle %}{% endblock %}</span>
        </div>

        <div class="topbar-center">
            <nav class="nav-links" aria-label="Hauptnavigation">
                <a href="/" class="nav-link {% if active_page == 'display' %}active{% endif %}"{% if active_page == 'display' %} aria-current="page"{% endif %}>Anzeige</a>
                <a href="/inhalte" class="nav-link {% if active_page == 'content' %}active{% endif %}"{% if active_page == 'content' %} aria-current="page"{% endif %}>Inhalte</a>
                <a href="/geraet" class="nav-link {% if active_page == 'device' %}active{% endif %}"{% if active_page == 'device' %} aria-current="page"{% endif %}>Gerät</a>
                <a href="/system" class="nav-link {% if active_page == 'system' %}active{% endif %}"{% if active_page == 'system' %} aria-current="page"{% endif %}>System</a>
            </nav>
            {% block topbar_center %}{% endblock %}
        </div>

        <div class="topbar-right">
            {% block topbar_right %}{% endblock %}
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Darstellung wechseln" title="Hell/Dunkel-Modus für das gesamte Web-UI umschalten">
                <span class="theme-toggle-icon" id="themeIcon">🌙</span>
                <span id="themeLabel">Dark</span>
            </button>
        </div>
    </header>

    <div class="issue-strip" id="issueStrip" role="status" aria-live="polite" hidden></div>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</div>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
<script src="{{ url_for('static', filename='fields.js') }}"></script>
<script>
/* Statusleiste: Gerät still, Quelle gestört, Firmware wartet, Warnungen – jede Minute */
(function () {
    var strip = document.getElementById('issueStrip');
    var esc = ui.esc, shown = null;
    function render(items) {
        var html = items.slice(0, 6).map(function (i) {
            var tag = i.href ? 'a' : 'div';
            return '<' + tag + ' class="issue ' + esc(i.level) + '"' + (i.href ? ' href="' + esc(i.href) + '"' : '') + '>'
                + '<span class="dot" aria-hidden="true"></span><span class="text">' + esc(i.text) + '</span></' + tag + '>';
        }).join('') + (items.length > 6 ? '<div class="issue"><span class="dot" aria-hidden="true"></span><span class="text">und ' + (items.length - 6) + ' weitere</span></div>' : '');
        // Nur bei Änderung neu schreiben: sonst liest ein Screenreader jede Minute dasselbe vor
        if (html === shown) return;
        shown = html;
        strip.innerHTML = html;
        strip.hidden = !items.length;
    }
    async function load() {
        try { render((await ui.json('/api/issues')).issues || []); }
        catch (e) {
            render([{ level: 'danger', href: '', text: 'Server nicht erreichbar – was diese Seite zeigt, ist womöglich nicht aktuell.' }]);
            throw e;
        }
    }
    ui.poll(load, 60000)();
})();
</script>
<script>
(function () {
    var html = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var icon = document.getElementById('themeIcon');
    var label = document.getElementById('themeLabel');
    var THEMES = {
        dark: { icon: '🌙', label: 'Dark' },
        light: { icon: '☀️', label: 'Light' }
    };
    function applyTheme(t) {
        html.setAttribute('data-theme', t);
        icon.textContent = (THEMES[t] || THEMES.dark).icon;
        label.textContent = (THEMES[t] || THEMES.dark).label;
        localStorage.setItem('inkwall-ui-theme', t);
    }
    applyTheme(html.getAttribute('data-theme') || 'dark');
    btn.addEventListener('click', function () {
        var cur = html.getAttribute('data-theme') || 'dark';
        applyTheme(cur === 'dark' ? 'light' : 'dark');
    });
})();
</script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
